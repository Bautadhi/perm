<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permintaan Toko</title>
    <style>
        html, body {
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
    </style>
    <script>
        (function() {
            var URL_HP = 'https://polytasik-pixel.github.io/permintaanToko/';
            var URL_PC = 'https://polytasik-pixel.github.io/permintaanTokoo/';
            
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            var isMobile = /Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|mobile|CriOS/i.test(ua) ||
                           (window.innerWidth <= 768) ||
                           (/Macintosh/i.test(ua) && navigator.maxTouchPoints && navigator.maxTouchPoints > 1);

            window.location.replace(isMobile ? URL_HP : URL_PC);
        })();
    </script>
</head>
<body>
    <noscript>
        <div style="font-family: sans-serif; text-align: center; padding: 40px; color: #333;">
            <h2>Permintaan Toko</h2>
            <p>Silakan pilih versi yang sesuai dengan perangkat Anda:</p>
            <p><a href="https://polytasik-pixel.github.io/permintaanToko/">📱 Versi HP (Smartphone)</a></p>
            <p><a href="https://polytasik-pixel.github.io/permintaanTokoo/">💻 Versi Laptop / PC</a></p>
        </div>
    </noscript>
</body>
</html>
